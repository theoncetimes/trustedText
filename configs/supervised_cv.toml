name = "supervised_cv"
description = """
In-distribution comparison of supervised detectors: 5-fold document-level
stratified CV repeated over 3 seeds. Regularization of the linear models is
tuned by inner CV on each training fold.
"""
seeds = [0, 1, 2]

[data]
dir = "data"
clean = true

[split]
type = "kfold"
n_splits = 5

[evaluation]
reference = "char_tfidf"
n_bootstrap = 1000

[[detectors]]
name = "word_tfidf"
type = "tfidf"
analyzer = "word"
ngram_range = [1, 2]

[[detectors]]
name = "char_tfidf"
type = "tfidf"
analyzer = "char_wb"
ngram_range = [2, 5]

[[detectors]]
name = "qwen_embedding_lr"
type = "embedding_lr"

[[detectors]]
name = "trustedtext_contrastive"
type = "contrastive"
