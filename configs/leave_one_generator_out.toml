name = "leave_one_generator_out"
description = """
Generalization to unseen generators: each AI generator with at least 3
documents is held out in turn, together with a random 20% of human documents.
Smaller generator groups stay in training only.
"""
seeds = [0, 1, 2]

[data]
dir = "data"
clean = true

[split]
type = "logo"
side = "ai"
other_test_fraction = 0.2
min_group_size = 3

[evaluation]
reference = "char_tfidf"
n_bootstrap = 500

[[detectors]]
name = "char_tfidf"
type = "tfidf"
analyzer = "char_wb"
ngram_range = [2, 5]

[[detectors]]
name = "qwen_embedding_lr"
type = "embedding_lr"

[[detectors]]
name = "trustedtext_contrastive"
type = "contrastive"

[[detectors]]
name = "fast_detectgpt"
type = "zeroshot"
feature = "fast_detectgpt"

[[detectors]]
name = "binoculars"
type = "binoculars"
