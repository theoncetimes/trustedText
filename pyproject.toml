[project]
name = "trustedtext"
version = "0.1.0"
description = "AI Text Detection using Neural Networks with Contrastive Learning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.1",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.4.0",
    "transformers>=4.57.0",
    "torch>=2.11.0",
    "rich>=13.9.4",
    "inquirer>=3.4.0",
    "fastapi>=0.128.0",
    "uvicorn>=0.34.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "dotenv>=0.9.9",
]

[project.scripts]
trustedtext-train = "trustedtext.train:main"
trustedtext-bench = "trustedtext.bench.runner:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustedtext"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
